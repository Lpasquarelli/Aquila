services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6381:6379"]
    volumes: [redis_sessions_data:/data]
  redis-rate-limit:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:6380:6379"]
    volumes: [redis_rate_limit_data:/data]
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ChangeThis_Local_Only!42"
    ports: ["127.0.0.1:1434:1433"]
    volumes: [sql_data:/var/opt/mssql]
  nats:
    image: nats:2.12-alpine
    command: ["-c", "/etc/nats/nats.conf", "-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    volumes: [nats_data:/data, ./nats-dev.conf:/etc/nats/nats.conf:ro]
volumes:
  redis_sessions_data:
  redis_rate_limit_data:
  sql_data:
  nats_data:
